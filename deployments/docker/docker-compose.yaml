services:
  postgres:
    ports:
      - "5432:5432"
    image: postgres:13
    environment:
      POSTGRES_USER: forgevault
      POSTGRES_PASSWORD: forgevault
      POSTGRES_DB: forgevault
    restart: unless-stopped
    volumes:
    - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgevault -d forgevault"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    image: minio/minio
    environment:
      MINIO_ROOT_USER:  minioadmin
      MINIO_ROOT_PASSWORD:  minioadmin
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  
volumes:
  db_data:
  minio_data: