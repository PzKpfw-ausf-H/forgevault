openapi: 3.0.3
info:
  title: ForgeVault API
  version: 0.1.0

servers:
  - url: http://localhost:8080

tags:
  - name: Health
  - name: Assets
  - name: Files
  - name: Auth

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /assets:
    get:
      tags: [Assets]
      summary: List assets
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: titleSub
          schema: { type: string }
        - in: query
          name: authorId
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Assets]
      summary: Create asset
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset by ID
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Assets]
      summary: Patch asset
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAssetRequest"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Assets]
      summary: Delete asset
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/files/upload-url:
    post:
      tags: [Files]
      summary: Get presigned upload URL
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadURLRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadURLResponse"
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/files/confirm:
    post:
      tags: [Files]
      summary: Confirm uploaded file
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "201":
          description: Confirmed (no content)
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/files/{version}/download-url:
    get:
      tags: [Files]
      summary: Get presigned download URL
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - in: path
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Presigned download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadURLResponse"
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequestOrValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    AssetID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequestOrValidation:
      description: Bad request / invalid JSON / validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required: [error]

    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: |
            Examples from your code: bad_request, validation_error, unauthorized, not_found, conflict, internal
        message:
          type: string
        field:
          type: string
          nullable: true
      required: [code, message]

    CreateAssetRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        type: { type: string }
        tags:
          type: array
          items: { type: string }
      required: [title, type]

    PatchAssetRequest:
      type: object
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        type: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          nullable: true

    AssetResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        type: { type: string }
        tags:
          type: array
          items: { type: string }
        authorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, description, type, tags, authorId, createdAt, updatedAt]

    UploadURLRequest:
      type: object
      properties:
        filename: { type: string }
        contentType: { type: string }
      required: [filename]

    UploadURLResponse:
      type: object
      properties:
        version: { type: integer }
        storageKey: { type: string }
        uploadUrl: { type: string }
        expiresIn: { type: integer, format: int64 }
      required: [version, storageKey, uploadUrl, expiresIn]

    ConfirmRequest:
      type: object
      properties:
        version: { type: integer }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        storageKey: { type: string }
        checksum: { type: string }
      required: [version, filename, storageKey]

    DownloadURLResponse:
      type: object
      properties:
        downloadUrl: { type: string }
        expiresIn: { type: integer, format: int64 }
      required: [downloadUrl, expiresIn]

    RegisterRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string }
      required: [refreshToken]

    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string }
      required: [refreshToken]

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, format: int64 }
        refreshToken: { type: string }
        refreshExpiresIn: { type: integer, format: int64 }
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]

    RegisterResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
      required: [id, email]